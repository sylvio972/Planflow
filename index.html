<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>LMT Planning Flow</title>
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/sylvio972/Planflow/main/2533CD4C-9971-414A-9CE9-B8AAD86CC1CF.png"/>
<link rel="icon" href="https://raw.githubusercontent.com/sylvio972/Planflow/main/2533CD4C-9971-414A-9CE9-B8AAD86CC1CF.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>:root{--bg:#0a0a0a;--s1:#111;--s2:#181818;--s3:#222;--bd:#2a2a2a;--gd:#d4a017;--g2:#f0c040;--g3:#b8860b;--tx:#f5f0e8;--t2:#777;--t3:#444;--rd:#e04444;--gn:#44cc88;--bl:#4488ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Inter,sans-serif;min-height:100vh;overflow-x:hidden}
.lion-bg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:70vw;max-width:400px;opacity:.5;pointer-events:none;z-index:0;border-radius:20px;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.5}}
.fi{animation:fi .25s ease forwards}
.hdr{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.himg{width:32px;height:32px;border-radius:8px;object-fit:cover}
.hlmt{font-size:14px;font-weight:800;color:var(--g2);letter-spacing:2px}
.hsub{font-size:8px;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase}
.clk{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--gd);background:#d4a01710;border:1px solid #d4a01725;border-radius:7px;padding:4px 9px}
.bout{display:flex;align-items:center;gap:5px;background:transparent;color:var(--t2);border:1px solid var(--bd);border-radius:8px;padding:5px 11px;font-size:11px;font-weight:500;cursor:pointer;font-family:Inter,sans-serif}
.nwrap{padding:12px 14px 0}
.nav{display:flex;gap:2px;background:var(--s1);border-radius:12px;padding:3px;border:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ni{flex:1;min-width:52px;padding:7px 3px;border-radius:9px;font-size:9px;font-weight:600;cursor:pointer;text-align:center;color:var(--t2);border:none;background:transparent;font-family:Inter,sans-serif;white-space:nowrap;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px}
.ni svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ni.on{background:var(--s3);color:var(--g2)}
.nb{background:var(--rd);color:#fff;border-radius:99px;padding:1px 5px;font-size:7px;font-weight:800;margin-left:2px}
.pg{max-width:860px;margin:0 auto;padding:14px}
.sec{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--bd)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:13px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--c,var(--gd)) 40%,transparent)}
.sico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-bottom:7px}
.sico svg{width:14px;height:14px;stroke:var(--c,var(--gd));fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sn{font-size:24px;font-weight:800;font-family:"JetBrains Mono",monospace;color:var(--c,var(--gd))}
.sl{font-size:9px;color:var(--t2);margin-top:2px;text-transform:uppercase;letter-spacing:.8px}
.wc{background:linear-gradient(135deg,#1a1200,var(--s1));border:1px solid #d4a01728;border-radius:14px;padding:13px;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between}
.wico{font-size:26px;margin-right:10px}
.wt{font-size:22px;font-weight:800;font-family:"JetBrains Mono",monospace;color:var(--g2)}
.wd{font-size:9px;color:var(--t2);margin-top:1px;text-transform:uppercase;letter-spacing:.8px}
.wl{font-size:9px;color:var(--t3);margin-top:1px}
.wdt{font-size:10px;color:var(--t2);margin-bottom:2px}
.wa{font-size:9px;color:var(--gd);background:#d4a01715;border-radius:5px;padding:2px 6px;margin-top:3px;display:inline-block}
.eomc{background:linear-gradient(135deg,#1a1200,var(--s1));border:1px solid #d4a01740;border-radius:14px;padding:15px;margin-bottom:13px;position:relative;overflow:hidden}
.eomc::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--g2),var(--gd),transparent)}
.eoml{font-size:9px;font-weight:700;color:var(--gd);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:5px;overflow:hidden}
.eomb{display:flex;align-items:center;gap:12px}
.eomav{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.eomn{font-size:15px;font-weight:800;color:var(--g2)}
.eomr{font-size:10px;color:var(--t2);margin-top:1px}
.eomm2{font-size:10px;color:var(--g3);font-weight:600;margin-top:2px}
.eommsg{font-size:11px;color:var(--tx);margin-top:6px;font-style:italic;background:#d4a01710;border-radius:7px;padding:6px 10px;border-left:2px solid var(--gd)}
.eombtn{display:inline-flex;align-items:center;gap:4px;background:transparent;color:var(--gd);border:1px solid #d4a01730;border-radius:7px;padding:4px 10px;font-size:9px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;margin-top:8px}
.alt{background:var(--s1);border-radius:11px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;border-left:2px solid}
.alt.w{border-color:var(--gd)}.alt.i{border-color:var(--bd)}.alt.d{border-color:var(--rd)}
.altico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.altico svg{width:13px;height:13px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alt.w .altico{background:#d4a01715}.alt.w .altico svg{stroke:var(--gd)}
.alt.i .altico{background:#44cc8815}.alt.i .altico svg{stroke:var(--gn)}
.altt{font-size:12px;font-weight:600;line-height:1.4}
.alttm{font-size:9px;color:var(--t2);margin-top:2px;font-family:"JetBrains Mono",monospace}
.emp{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:12px 13px;display:flex;align-items:center;gap:11px;margin-bottom:8px;transition:all .2s}
.emp.on{border-color:#d4a01735;background:linear-gradient(135deg,#d4a01706,var(--s1))}
.av{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.ei{flex:1;min-width:0}
.en{font-weight:700;font-size:13px}
.er{font-size:10px;color:var(--t2);margin-top:1px}
.est{display:flex;align-items:center;gap:5px;margin-top:4px}
.dot{width:6px;height:6px;border-radius:99px;flex-shrink:0}
.dot.on{background:var(--gd);box-shadow:0 0 5px var(--gd);animation:pu 2s infinite}
.dot.off{background:var(--t3)}
.stx{font-size:10px;font-weight:500}
.stx.on{color:var(--gd)}.stx.off{color:var(--t3)}
.eh{font-size:12px;font-weight:700;color:var(--gd);text-align:right;margin-bottom:4px}
.pb{padding:6px 12px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;border:none;font-family:Inter,sans-serif;display:flex;align-items:center;gap:4px}
.pb svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pb-a{background:linear-gradient(135deg,var(--g2),var(--gd));color:#000}
.pb-p{background:linear-gradient(135deg,var(--rd),#bb2222);color:#fff}
.hday{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.hdate{font-size:11px;font-weight:700;color:var(--gd);margin-bottom:8px}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--bd)}
.hav{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;flex-shrink:0}
.hi{flex:1}
.hn{font-size:11px;font-weight:600}
.ht{font-size:9px;color:var(--t2);font-family:"JetBrains Mono",monospace;margin-top:1px}
.hh{font-size:11px;font-weight:700;color:var(--gd);font-family:"JetBrains Mono",monospace}
.task{background:var(--s1);border-radius:12px;padding:12px 13px;margin-bottom:8px;border-left:2px solid var(--gd)}
.ttop{display:flex;align-items:flex-start;gap:10px}
.ti{flex:1;min-width:0}
.tt{font-weight:700;font-size:13px}
.tm{font-size:10px;color:var(--t2);margin-top:2px}
.tc{font-size:11px;color:var(--tx);background:var(--s2);border-radius:7px;padding:5px 8px;margin-top:5px}
.mr{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.mb{display:inline-flex;align-items:center;gap:5px;background:var(--s2);color:var(--gd);border:1px solid #d4a01728;border-radius:8px;padding:5px 10px;font-size:10px;font-weight:600;text-decoration:none;font-family:Inter,sans-serif}
.mb svg{width:11px;height:11px;fill:none;stroke:var(--gd);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dst{font-size:10px;color:var(--t2);background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:4px 9px;font-family:"JetBrains Mono",monospace}
.bdg{border-radius:99px;padding:2px 9px;font-size:9px;font-weight:700;flex-shrink:0}
.bd{background:#44cc8815;color:var(--gn);border:1px solid #44cc8828}
.bp{background:#d4a01715;color:var(--gd);border:1px solid #d4a01728}
.bc{background:#e0444415;color:var(--rd);border:1px solid #e0444428}
.sgb{display:inline-flex;align-items:center;gap:4px;background:#44cc8815;color:var(--gn);border:1px solid #44cc8828;border-radius:99px;padding:2px 8px;font-size:9px;font-weight:700}
.dl{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin:12px 0 5px 2px}
.fr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:13px;gap:10px;flex-wrap:wrap}
.badd{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--g2),var(--gd));color:#000;border:none;border-radius:9px;padding:7px 13px;font-weight:700;font-size:11px;cursor:pointer;font-family:Inter,sans-serif}
.badd svg{width:12px;height:12px;fill:none;stroke:#000;stroke-width:2.5;stroke-linecap:round}
.be{background:transparent;color:var(--gd);border:1px solid #d4a01728;border-radius:7px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
.bdd{background:transparent;color:var(--rd);border:1px solid #e0444428;border-radius:7px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
.bg{background:transparent;color:var(--gn);border:1px solid #44cc8828;border-radius:7px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
.cts{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.ct{padding:5px 12px;border-radius:99px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--bd);color:var(--t2);background:transparent;font-family:Inter,sans-serif}
.ct.on{background:#d4a01712;color:var(--gd);border-color:#d4a01735}
.mwrap{display:flex;flex-direction:column;height:calc(100vh - 280px);min-height:300px}
.mlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:2px 0 10px;scrollbar-width:none}
.mlist::-webkit-scrollbar{display:none}
.bw{display:flex;flex-direction:column}
.bw.me{align-items:flex-end}.bw.ot{align-items:flex-start}
.bau{font-size:9px;color:var(--t2);margin-bottom:2px;padding:0 4px}
.bub{max-width:78%;padding:9px 13px;border-radius:13px;font-size:12px;line-height:1.5}
.bub.me{background:linear-gradient(135deg,var(--g2),var(--gd));color:#000;font-weight:600;border-bottom-right-radius:4px}
.bub.ot{background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-bottom-left-radius:4px}
.btm{font-size:9px;opacity:.5;margin-top:2px;font-family:"JetBrains Mono",monospace}
.mrow{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.min{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:9px 13px;color:var(--tx);font-size:12px;outline:none;resize:none;min-height:40px;max-height:90px;font-family:Inter,sans-serif}
.min:focus{border-color:var(--gd)}
.msb{background:linear-gradient(135deg,var(--g2),var(--gd));border:none;border-radius:12px;width:40px;height:40px;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msb svg{width:14px;height:14px;fill:none;stroke:#000;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.inp{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;color:var(--tx);font-size:12px;width:100%;outline:none;font-family:Inter,sans-serif}
.inp:focus{border-color:var(--gd)}
select.inp{cursor:pointer}
.lbl{font-size:9px;font-weight:700;color:var(--t2);margin-bottom:4px;display:block;letter-spacing:.8px;text-transform:uppercase}
.fg{margin-bottom:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s2{grid-column:span 2}
textarea.inp{min-height:55px;resize:vertical}
.mbg{display:none;position:fixed;inset:0;background:#0009;z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.mbg.op{display:flex}
.mdl{background:var(--s1);border-radius:18px;border:1px solid var(--bd);padding:22px;width:min(440px,94vw);max-height:90vh;overflow-y:auto}
.mttl{font-weight:800;font-size:15px;margin-bottom:16px;color:var(--g2)}
.mac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.bcn{background:transparent;color:var(--t2);border:1px solid var(--bd);border-radius:9px;padding:8px 16px;font-weight:600;font-size:12px;cursor:pointer;font-family:Inter,sans-serif}
.bsv{background:linear-gradient(135deg,var(--g2),var(--gd));color:#000;border:none;border-radius:9px;padding:8px 16px;font-weight:800;font-size:12px;cursor:pointer;font-family:Inter,sans-serif}
.swrap{background:#fff;border-radius:10px;border:2px solid #ddd;margin-bottom:12px;position:relative;overflow:hidden}
.shint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#aaa;pointer-events:none;font-style:italic;white-space:nowrap}
#sgc{display:block;width:100%;cursor:crosshair;touch-action:none}
.bclr{background:transparent;color:var(--rd);border:1px solid #e0444430;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif}
.bpdf{display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--g2),var(--gd));color:#000;border:none;border-radius:9px;padding:10px 18px;font-weight:800;font-size:12px;cursor:pointer;font-family:Inter,sans-serif;margin-top:12px;width:100%}
.bpdf svg{width:13px;height:13px;fill:none;stroke:#000;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#lg{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.lc{background:var(--s1);border:1px solid var(--bd);border-radius:24px;padding:36px 28px;width:min(360px,100%);text-align:center}
.li{width:88px;height:88px;border-radius:18px;object-fit:cover;margin:0 auto 16px;display:block;box-shadow:0 8px 32px #d4a01728}
.ll{font-size:30px;font-weight:900;color:var(--g2);letter-spacing:4px}
.ln{font-size:10px;color:var(--t2);letter-spacing:2px;text-transform:uppercase;margin:5px 0 3px;font-weight:500}
.lt{font-size:10px;color:var(--t3);margin-bottom:22px;font-style:italic}
.ldv{height:1px;background:linear-gradient(90deg,transparent,#d4a01735,transparent);margin-bottom:20px}
.linp{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;color:var(--tx);font-size:15px;width:100%;outline:none;text-align:center;letter-spacing:5px;font-family:"JetBrains Mono",monospace}
.linp:focus{border-color:var(--gd)}
.lerr{color:var(--rd);font-size:11px;margin-top:6px;min-height:16px}
.lbtn{background:linear-gradient(135deg,var(--g2),var(--gd));color:#000;border:none;border-radius:12px;padding:13px;width:100%;font-weight:800;font-size:13px;cursor:pointer;font-family:Inter,sans-serif;letter-spacing:1px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.lbtn svg{width:16px;height:16px;fill:none;stroke:#000;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.lh{margin-top:14px;font-size:9px;color:var(--t3);font-family:"JetBrains Mono",monospace;letter-spacing:1px}
.tst{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--s2);border:1px solid #d4a01735;border-radius:10px;padding:8px 16px;font-size:11px;font-weight:600;color:var(--tx);z-index:999;opacity:0;transition:all .25s;white-space:nowrap;max-width:90vw;text-align:center;display:flex;align-items:center;gap:6px}
.tst svg{width:13px;height:13px;fill:none;stroke:var(--gd);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:99px}</style>
</head>

<script>

  hs:'<svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.7L1 10"/></svg>',
  us:'<svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/></svg>',
  hm:'<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11H5z"/></svg>',
  ck:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  wn:'<svg viewBox="0 0 24 24"><line x1="12" y1="9" x2="12" y2="13"/></svg>',
  mp:'<svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>',
  pl:'<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  sp:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
  sd:'<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/></svg>',
  ps:'<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  pd:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16h16V8z"/></svg>',
  pn:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  st:'<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
};

function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}

var mode=ld("lm","");
var emps=ld("le",[{id:1,name:"Marie Dupont",role:"Technicienne",av:"MD"},{id:2,name:"Jean-Luc",role:"Chef",av:"JL"},{id:3,name:"Sofia Martin",role:"Assistante",av:"SM"}]);
var tasks=ld("lt",[{id:1,empId:1,title:"Maintenance",type:"intervention",date:"2026-06-01",start:"08:00",end:"12:00",loc:"Fort-de-France",status:"done",comment:"OK"},{id:2,empId:2,title:"Réunion",type:"horaire",date:"2026-06-02",start:"09:00",end:"10:00",loc:"Salle",status:"pending",comment:""},{id:3,empId:3,title:"Chantier C",type:"intervention",date:"2026-06-03",start:"07:30",end:"16:30",loc:"Le Lamentin",status:"pending",comment:"EPI"},{id:4,empId:1,title:"Formation",type:"horaire",date:"2026-06-04",start:"14:00",end:"17:00",loc:"Schoelcher",status:"pending",comment:""}]);
var notifs=ld("ln",[{id:1,text:"Tâche terminée",time:"2h",read:false},{id:2,text:"Planning à jour",time:"Hier",read:true}]);
var msgs=ld("lmsg",[{id:1,ch:"general",author:"Admin",am:"admin",text:"Bonjour !",time:"08:00",read:false}]);
var pts=ld("lp",{});
var hist=ld("lhi",[{date:"2026-05-30",records:[{empId:1,arrive:"07:55",partir:"16:05"}]}]);
var eom=ld("leo",null);
var wthr=ld("lw",null);
var tab="dashboard",eid=null,fep="all",cch="general";
var stid=null,sctx=null,sdat=null,sdrw=false;

function persist(){sv("lm",mode);sv("le",emps);sv("lt",tasks);sv("ln",notifs);sv("lmsg",msgs);sv("lp",pts);sv("lhi",hist);sv("leo",eom);}
function pad(n){return String(n).padStart(2,"0");}
function tick(){var d=new Date();var el=document.getElementById("clk");if(el)el.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}
function toast(t){document.getElementById("tmsg").textContent=t;var el=document.getElementById("tst");el.classList.add("on");setTimeout(function(){el.classList.remove("on");},2800);}
function addN(t){notifs=[{id:Date.now(),text:t,time:"À l'instant",read:false}].concat(notifs);persist();rNav();toast(t);}

function doLogin(){var v=document.getElementById("ci").value;if(v===adminCode||v===AD){mode="admin";persist();go();}else if(v===teamCode||v===EP){mode="employee";persist();go();}else document.getElementById("le").textContent="Code incorrect.";}
function doLogout(){
  var td=new Date().toISOString().slice(0,10);
  var rec=[];
  emps.forEach(function(e){if(pts[e.id]&&pts[e.id].a)rec.push({empId:e.id,arrive:pts[e.id].a,partir:pts[e.id].d||"—"});});
  if(rec.length){hist=hist.filter(function(h){return h.date!==td;});hist=[{date:td,records:rec}].concat(hist).slice(0,30);sv("lhi",hist);}
  mode="";sv("lm","");
  document.getElementById("ap").style.display="none";
  document.getElementById("lg").style.display="flex";
  document.getElementById("ci").value="";
}
function go(){document.getElementById("lg").style.display="none";document.getElementById("ap").style.display="block";tab="dashboard";rNav();render();loadW();}

function loadW(){
  fetch("https://wttr.in/Martinique?format=j1").then(function(r){return r.json();}).then(function(d){
    var c=d.current_condition[0],code=parseInt(c.weatherCode);
    var ico=code<=113?"☀️":code<=116?"⛅":code<=122?"☁️":"🌧️";
    var desc=c.lang_fr&&c.lang_fr[0]?c.lang_fr[0].value:c.weatherDesc[0].value;
    wthr={temp:c.temp_C,feels:c.FeelsLikeC,desc:desc,hum:c.humidity,wind:c.windspeedKmph,ico:ico};
    sv("lw",wthr);if(tab==="dashboard")render();
  }).catch(function(){wthr={temp:"27",feels:"30",desc:"Ensoleillé",hum:"75",wind:"15",ico:"☀️"};if(tab==="dashboard")render();});
}

function unr(){return notifs.filter(function(n){return !n.read;}).length;}
function fd(d){if(!d)return"";var p=d.split("-");return p[2]+"/"+p[1];}
function fdF(d){if(!d)return"";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function nt(){return new Date().toTimeString().slice(0,5);}
function gc(id){var i=emps.findIndex(function(e){return e.id===id;});return CL[i%CL.length]||CL[0];}
function gh(id){var p=pts[id];if(!p||!p.a)return 0;var e=p.d||nt();var ah=parseInt(p.a.split(":")[0]),am=parseInt(p.a.split(":")[1]),eh=parseInt(e.split(":")[0]),em=parseInt(e.split(":")[1]);return Math.max(0,((eh*60+em)-(ah*60+am))/60).toFixed(1);}
function isP(id){var p=pts[id];return p&&p.a&&!p.d;}
function totH(){return emps.reduce(function(s,e){return s+parseFloat(gh(e.id));},0).toFixed(1);}
function presC(){return emps.filter(function(e){return isP(e.id);}).length;}
function mUrl(a){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(a)+"&travelmode=driving";}
function dst(a){var l=a.toLowerCase();if(l.indexOf("fort-de-france")>=0)return "~5km";if(l.indexOf("lamentin")>=0)return "~15km";if(l.indexOf("schoelcher")>=0)return "~8km";return "Voir Maps";}
function cH(a,d){if(!a||a==="—"||!d||d==="—")return "—";var ah=parseInt(a.split(":")[0]),am=parseInt(a.split(":")[1]),dh=parseInt(d.split(":")[0]),dm=parseInt(d.split(":")[1]);return Math.max(0,((dh*60+dm)-(ah*60+am))/60).toFixed(1)+"h";}

function rNav(){
  var un=unr();
  var list=mode==="admin"
    ?[["dashboard","Dashboard",IC.db],["pointage","Pointage",IC.cl],["planning","Planning",IC.ca],["conges","Conges",IC.ca],["messages","Messages",IC.mg],["historique","Historique",IC.hs],["notifs","Alertes",IC.bl]]
    :[["pointage","Pointage",IC.cl],["planning","Planning",IC.ca],["conges","Conges",IC.ca],["messages","Messages",IC.mg],["notifs","Alertes",IC.bl]];
  document.getElementById("nav").innerHTML=list.map(function(x){
    var id=x[0],lbl=x[1],ico=x[2];
    var b=(id==="notifs"&&un>0)?'<span class="nb">'+un+"</span>":"";
    var cls="ni"+(tab===id?" on":"");
    return '<div class="'+cls+'" onclick="sw(\''+id+'\')">'+ico+"<span>"+lbl+b+"</span></div>";
  }).join("");
}
function sw(t){tab=t;rNav();render();}
function render(){
  var el=document.getElementById("pg");
  el.className="pg fi";void el.offsetWidth;
  if(tab==="dashboard")el.innerHTML=rDash();
  else if(tab==="pointage")el.innerHTML=rPt();
  else if(tab==="planning")el.innerHTML=rPl();
  else if(tab==="messages")el.innerHTML=rMsg();
  else if(tab==="historique")el.innerHTML=rHist();
  else if(tab==="conges")el.innerHTML=rConges();
  else el.innerHTML=rNot();
  if(tab==="messages")setTimeout(function(){var e=document.getElementById("ml");if(e)e.scrollTop=e.scrollHeight;},50);
}

function rDash(){
  var pr=presC(),ab=emps.length-pr,h=totH();
  var td=new Date().toISOString().slice(0,10);
  var tdt=tasks.filter(function(t){return t.date===td;});
  var dn=tdt.filter(function(t){return t.status==="done";}).length;
  var tot=tdt.length,pct=tot>0?Math.round((dn/tot)*100):0;
  var wc="";
  if(wthr){
    var wa=parseInt(wthr.wind)>40?'<div class="wa">Vent fort</div>':"";
    wc='<div class="wc"><div style="display:flex;align-items:center"><div class="wico">'+wthr.ico+'</div><div><div class="wt">'+wthr.temp+'°C</div><div class="wd">'+wthr.desc+'</div><div class="wl">Martinique</div></div></div><div style="text-align:right"><div class="wdt">Ressenti '+wthr.feels+'°C</div><div class="wdt">Humidité '+wthr.hum+'%</div><div class="wdt">Vent '+wthr.wind+' km/h</div>'+wa+'</div></div>';
  }
  var ec="";
  if(eom){
    var ee=emps.find(function(e){return e.id===eom.empId;});
    if(ee){
      var ecl=gc(ee.id);
      var em="";
      if(eom.month){var mp=eom.month.split("-");em=MN[parseInt(mp[1])-1]+" "+mp[0];}
      var eb=mode==="admin"?'<button class="eombtn" onclick="openEom()">'+IC.st+' Modifier</button>':"";
      ec='<div class="eomc"><div class="eoml">'+IC.st+' Employé du mois</div><div class="eomb"><div style="font-size:34px">&#127942;</div><div class="eomav" style="background:'+ecl+'25;color:'+ecl+'">'+ee.av+'</div><div style="flex:1"><div class="eomn">'+ee.name+'</div><div class="eomr">'+ee.role+'</div>'+(em?'<div class="eomm2">'+em+'</div>':"")+(eom.msg?'<div class="eommsg">'+eom.msg+'</div>':"")+eb+'</div></div></div>';
    }
  } else if(mode==="admin"){
    ec='<div class="eomc"><div class="eoml">'+IC.st+' Employé du mois</div><div style="text-align:center;padding:8px;color:var(--t2);font-size:12px">Aucun désigné.</div><button class="eombtn" onclick="openEom()">'+IC.st+' Désigner</button></div>';
  }
  var al="";
  emps.forEach(function(e){
    var p=pts[e.id];
    var tt=tdt.find(function(t){return t.empId===e.id;});
    if(tt&&(!p||!p.a))al+='<div class="alt w"><div class="altico">'+IC.wn+'</div><div><div class="altt">'+e.name+" n'a pas pointé</div>"+'<div class="alttm">Tâche à '+tt.start+'</div></div></div>';
  });
  if(!al)al='<div class="alt i"><div class="altico">'+IC.ck+'</div><div><div class="altt">Tout est en ordre</div><div class="alttm">'+nt()+'</div></div></div>';
  var pg=tot>0?'<div style="background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:14px;margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--t2);margin-bottom:6px"><span>Tâches du jour</span><span>'+dn+"/"+tot+" ("+pct+'%)</span></div><div style="background:var(--s3);border-radius:99px;height:5px"><div style="width:'+pct+'%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g3),var(--g2));transition:width .6s"></div></div></div>':"";
  var cal=rCalendar();
  var tip=rTip();
  var btns="";if(mode==="admin"){btns+='<button class="badd" onclick="openAddEmp()" style="margin-bottom:8px;width:100%;justify-content:center">+ Ajouter un employe</button>';btns+='<button class="badd" onclick="openRapport()" style="margin-bottom:8px;width:100%;justify-content:center;background:#1a1000;color:var(--g2);border:1px solid #d4a01740">Rapport mensuel PDF</button>';btns+='<button class="badd" onclick="openCodes()" style="margin-bottom:13px;width:100%;justify-content:center;background:transparent;color:var(--t2);border:1px solid var(--bd)">Codes acces entreprise</button>';}
  return wc+ec+tip+btns+cal+'<div class="stats"><div class="stat" style="--c:var(--gn)"><div class="sico" style="background:#44cc8815">'+IC.us+'</div><div class="sn">'+pr+'</div><div class="sl">Présents</div></div><div class="stat" style="--c:var(--rd)"><div class="sico" style="background:#e0444415">'+IC.hm+'</div><div class="sn">'+ab+'</div><div class="sl">Absents</div></div><div class="stat" style="--c:var(--gd)"><div class="sico" style="background:#d4a01715">'+IC.cl+'</div><div class="sn">'+h+'h</div><div class="sl">Heures</div></div><div class="stat" style="--c:var(--bl)"><div class="sico" style="background:#4488ff15">'+IC.ca+'</div><div class="sn">'+dn+"/"+tot+'</div><div class="sl">Tâches</div></div></div>'+pg+'<div class="sec">Alertes</div>'+al;
}

function rPt(){
  var h='<div class="sec">Pointage du jour</div>';
  emps.forEach(function(e){
    var c=gc(e.id),p=pts[e.id]||{};
    var pr=p.a&&!p.d,hh=gh(e.id);
    var st=pr?"Arrivé à "+p.a:(p.a&&p.d)?"Parti "+p.d+" ("+hh+"h)":"Non pointé";
    var btn;
    if(!p.a){btn='<button class="pb pb-a" onclick="doPt('+e.id+',0)">'+IC.pl+' Arrivée</button>';}
    else if(!p.d){btn='<button class="pb pb-p" onclick="doPt('+e.id+',1)">'+IC.sp+' Départ</button>';}
    else{btn='<span style="font-size:10px;color:var(--gd);font-weight:600">✓ '+hh+'h</span>';}
    h+='<div class="emp'+(pr?" on":"")+'"><div class="av" style="background:'+c+'20;color:'+c+'">'+e.av+'</div><div class="ei"><div class="en">'+e.name+'</div><div class="er">'+e.role+'</div><div class="est"><div class="dot '+(pr?"on":"off")+'"></div><span class="stx '+(pr?"on":"off")+'">'+st+'</span></div></div><div style="text-align:right;flex-shrink:0">'+(pr?'<div class="eh">'+hh+'h</div>':"")+btn+'</div></div>';
  });
  return h;
}
function doPt(id,t){
  var type=t===0?"a":"d";
  if(!pts[id])pts[id]={};
  pts[id][type]=nt();
  persist();
  var e=emps.find(function(x){return x.id===id;});
  addN(e.name+" — "+(type==="a"?"arrivée":"départ")+" "+nt());
  render();
}

function rHist(){
  var h='<div class="sec">Historique</div>';
  if(!hist.length)return h+'<p style="color:var(--t2);font-size:13px;text-align:center;padding:20px">Aucun historique.</p>';
  hist.slice(0,10).forEach(function(day){
    var rows="";
    day.records.forEach(function(r){
      var e=emps.find(function(x){return x.id===r.empId;})||{name:"?",av:"?"};
      var c=gc(r.empId);
      rows+='<div class="hrow"><div class="hav" style="background:'+c+'20;color:'+c+'">'+e.av+'</div><div class="hi"><div class="hn">'+e.name+'</div><div class="ht">'+r.arrive+' → '+r.partir+'</div></div><div class="hh">'+cH(r.arrive,r.partir)+'</div></div>';
    });
    h+='<div class="hday"><div class="hdate">'+fdF(day.date)+'</div>'+rows+'</div>';
  });
  return h;
}

function rPl(){

  sctx=c.getContext("2d");sctx.strokeStyle="#111";sctx.lineWidth=3;sctx.lineCap="round";sctx.lineJoin="round";sctx.clearRect(0,0,c.width,c.height);

  function gp(e){var r=c.getBoundingClientRect();var sx=c.width/r.width,sy=c.height/r.height;var s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*sx,y:(s.clientY-r.top)*sy};}
  c.onmousedown=c.ontouchstart=function(e){e.preventDefault();sdrw=true;document.getElementById("sh").style.display="none";var p=gp(e);sctx.beginPath();sctx.moveTo(p.x,p.y);};
  c.onmousemove=c.ontouchmove=function(e){e.preventDefault();if(!sdrw)return;var p=gp(e);sctx.lineTo(p.x,p.y);sctx.stroke();};
  c.onmouseup=c.ontouchend=function(e){e.preventDefault();sdrw=false;};
}

// ── CALENDRIER ────────────────────────────────────────────────────────────────
function rCalendar(){
  var now=new Date();
  var year=now.getFullYear();
  var month=now.getMonth();
  var today=now.getDate();
  var MNS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  var firstDay=new Date(year,month,1).getDay();
  firstDay=firstDay===0?6:firstDay-1; // Monday first
  var daysInMonth=new Date(year,month+1,0).getDate();
  var taskDates={};
  tasks.forEach(function(t){
    var d=new Date(t.date);
    if(d.getMonth()===month&&d.getFullYear()===year){
      var day=d.getDate();
      if(!taskDates[day])taskDates[day]=[];
      taskDates[day].push(t);
    }
  });
  var h='<div style="background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:13px">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
  h+='<div style="font-size:14px;font-weight:800;color:var(--g2)">'+MNS[month]+' '+year+'</div>';
  h+='<div style="font-size:10px;color:var(--t2)">Aujourd\'hui : '+today+'/'+pad(month+1)+'/'+year+'</div>';
  h+='</div>';
  // Days header
  var dnames=["L","M","M","J","V","S","D"];
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">';
  dnames.forEach(function(d){h+='<div style="text-align:center;font-size:9px;font-weight:700;color:var(--t3);padding:3px">'+d+'</div>';});
  h+='</div>';
  // Days grid
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
  for(var i=0;i<firstDay;i++){h+='<div></div>';}
  for(var d=1;d<=daysInMonth;d++){
    var isToday=d===today;
    var hasTasks=taskDates[d]&&taskDates[d].length>0;
    var doneAll=hasTasks&&taskDates[d].every(function(t){return t.status==="done";});
    var bg=isToday?"background:var(--gd);color:#000;font-weight:800":hasTasks?(doneAll?"background:#44cc8820;color:var(--gn)":"background:#d4a01720;color:var(--g2)"):"background:var(--s2);color:var(--t2)";
    h+='<div style="text-align:center;padding:5px 2px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;'+bg+'" onclick="showDayTasks('+d+','+month+','+year+')">';
    h+=d;
    if(hasTasks)h+='<div style="width:4px;height:4px;border-radius:99px;background:'+(isToday?"#000":"var(--gd)")+';margin:2px auto 0"></div>';
    h+='</div>';
  }
  h+='</div></div>';
  return h;
}

function showDayTasks(d,m,y){

    h+='<div style="background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:8px">';
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">';
    h+='<div class="av" style="background:'+col+'20;color:'+col+';width:34px;height:34px;border-radius:9px;font-size:11px">'+emp.av+'</div>';
    h+='<div style="flex:1"><div style="font-weight:700;font-size:13px">'+emp.name+'</div>';
    h+='<div style="font-size:10px;color:var(--t2)">'+typeLabel+' - '+c.from+' au '+c.to+'</div>';
    if(c.reason)h+='<div style="font-size:11px;color:var(--tx);margin-top:3px">'+c.reason+'</div>';
    h+='</div>';
    h+='<span style="background:'+stColor+'20;color:'+stColor+';border:1px solid '+stColor+'40;border-radius:99px;padding:2px 9px;font-size:9px;font-weight:700">'+stLabel+'</span>';
    h+='</div>';
    if(isA&&c.status==="pending"){
      h+='<div style="display:flex;gap:8px">';
      h+='<button class="badd" onclick="approuverConge('+c.id+')" style="flex:1;justify-content:center;padding:6px;font-size:11px">Approuver</button>';
      h+='<button class="badd" onclick="refuserConge('+c.id+')" style="flex:1;justify-content:center;padding:6px;font-size:11px;background:var(--rd);color:#fff;border:none">Refuser</button>';
      h+='</div>';
    }
    if(isA){
      h+='<button onclick="deleteConge('+c.id+')" style="background:transparent;color:var(--t3);border:none;font-size:10px;cursor:pointer;margin-top:4px">Supprimer</button>';
    }
    h+='</div>';
  });
  return h;
}

function genQRUrl(text){
  return "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(text);
}
function openQRModal(taskId){
  var t=tasks.find(function(x){return x.id===taskId;});
  if(!t)return;
  var emp=emps.find(function(e){return e.id===t.empId;})||{name:"?"};
  var qrData="LMT|"+taskId+"|"+t.title+"|"+t.date+"|"+t.start+"|"+emp.name;
  var qrUrl=genQRUrl(qrData);
  document.getElementById("qr-content").innerHTML=
    '<div style="text-align:center;padding:10px">'
    +'<div style="font-weight:700;font-size:14px;margin-bottom:4px;color:var(--g2)">'+t.title+'</div>'
    +'<div style="font-size:11px;color:var(--t2);margin-bottom:12px">'+emp.name+' - '+t.date+' - '+t.start+' a '+t.end+'</div>'
    +'<img src="'+qrUrl+'" style="width:180px;height:180px;border-radius:12px;background:#fff;padding:8px"/>'
    +'<div style="font-size:10px;color:var(--t2);margin-top:10px">Scanner pour pointer automatiquement</div>'
    +(t.loc?'<div style="font-size:11px;color:var(--gd);margin-top:6px">'+t.loc+'</div>':"")
    +'<button class="badd" onclick="printQR()" style="margin-top:14px;width:100%;justify-content:center">Imprimer le QR code</button>'
    +'</div>';
  document.getElementById("qr-modal").classList.add("op");
}
function closeQR(){document.getElementById("qr-modal").classList.remove("op");}
function printQR(){
  var content=document.getElementById("qr-content").innerHTML;
  var w=window.open("","_blank");
  if(!w){alert("Autorisez les popups.");return;}
  w.document.write("<!DOCTYPE html><html><head><meta charset='UTF-8'/><title>QR Code<\/title><style>body{font-family:Arial,sans-serif;padding:30px;text-align:center;max-width:400px;margin:0 auto}img{width:220px;height:220px}<\/style><\/head><body>"+content+"<\/body><\/html>");
  w.document.close();
}

// RAPPORT MENSUEL
var cc=ld("lmt_cc","MON_ENTREPRISE");
var adminCode=ld("lmt_ac","ADMIN2026");
var teamCode=ld("lmt_tc","TEAM2026");

function openRapport(){
  document.getElementById("rap-month").value=new Date().getFullYear()+"-"+pad(new Date().getMonth()+1);
  document.getElementById("rap-modal").classList.add("op");
}
function closeRapport(){document.getElementById("rap-modal").classList.remove("op");}

function genRapport(){
  var monthVal=document.getElementById("rap-month").value;
  if(!monthVal)return;
  var parts=monthVal.split("-");
  var year=parseInt(parts[0]),month=parseInt(parts[1])-1;
  var MNS=["Janvier","Fevrier","Mars","Avril","Mai","Juin","Juillet","Aout","Septembre","Octobre","Novembre","Decembre"];
  var monthName=MNS[month]+" "+year;
  var monthTasks=tasks.filter(function(t){var d=new Date(t.date);return d.getMonth()===month&&d.getFullYear()===year;});
  var today=new Date().toLocaleDateString("fr-FR");
  var totalDone=monthTasks.filter(function(t){return t.status==="done";}).length;
  var totalSigned=monthTasks.filter(function(t){return t.signature;}).length;
  var totalH=0;
  hist.forEach(function(day){day.records.forEach(function(r){if(r.arrive&&r.partir&&r.partir!=="—"){var ah=parseInt(r.arrive.split(":")[0]),am=parseInt(r.arrive.split(":")[1]),dh=parseInt(r.partir.split(":")[0]),dm=parseInt(r.partir.split(":")[1]);totalH+=Math.max(0,((dh*60+dm)-(ah*60+am))/60);}});});

  var html="<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Rapport "+monthName+"<\/title>";
  html+="<style>body{font-family:Arial,sans-serif;padding:20px;max-width:700px;margin:0 auto}";
  html+=".header{padding-bottom:12px;border-bottom:3px solid #d4a017;margin-bottom:16px}";
  html+=".title{font-size:20px;font-weight:900}.sub{font-size:11px;color:#888;margin-top:3px}";
  html+=".grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}";
  html+=".box{background:#f8f8f8;border-radius:8px;padding:12px;text-align:center}";
  html+=".num{font-size:22px;font-weight:900;color:#d4a017}.lbl{font-size:9px;color:#888;text-transform:uppercase}";
  html+=".row{display:flex;gap:8px;padding:8px;border-bottom:1px solid #f0f0f0;font-size:12px}";
  html+="<\/style><\/head><body>";
  html+='<div class="header"><div class="title">LMT PLANNING FLOW</div>';
  html+='<div class="sub">Rapport mensuel — '+monthName+' — Genere le '+today+'<\/div><\/div>';
  html+='<div class="grid">';
  html+='<div class="box"><div class="num">'+monthTasks.length+'<\/div><div class="lbl">Taches<\/div><\/div>';
  html+='<div class="box"><div class="num">'+totalDone+'<\/div><div class="lbl">Terminees<\/div><\/div>';
  html+='<div class="box"><div class="num">'+totalSigned+'<\/div><div class="lbl">Signes<\/div><\/div>';
  html+='<div class="box"><div class="num">'+totalH.toFixed(1)+'h<\/div><div class="lbl">Heures<\/div><\/div>';
  html+='<\/div>';
  if(monthTasks.length>0){
    html+='<div class="row" style="font-weight:700;background:#f8f8f8"><div style="flex:2">Intervention<\/div><div style="flex:1">Employe<\/div><div style="flex:1">Date<\/div><div style="flex:1">Statut<\/div><\/div>';
    monthTasks.forEach(function(t){var e=emps.find(function(x){return x.id===t.empId;})||{name:"?"};var st=t.status==="done"?"Termine":t.status==="cancelled"?"Annule":"En cours";html+='<div class="row"><div style="flex:2">'+t.title+'<\/div><div style="flex:1">'+e.name+'<\/div><div style="flex:1">'+t.date+'<\/div><div style="flex:1">'+st+(t.signature?" ✓":"")+'<\/div><\/div>';});
  }
  html+='<br><button onclick="window.print()" style="background:#d4a017;color:#000;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:13px;cursor:pointer;width:100%">Imprimer / PDF<\/button>';
  html+='<\/body><\/html>';
  var w=window.open("","_blank");
  if(!w){alert("Autorisez les popups.");return;}
  w.document.write(html);
  w.document.close();
  closeRapport();
}

// CHECKLIST
var DEFAULT_CHECKS=["EPI verifie","Zone securisee","Outillage complet","Client informe","Photos avant","Consignes respectees","Photos apres","Zone nettoyee","Client a valide","Bon a signer"];

function openChecklist(taskId){
  var t=tasks.find(function(x){return x.id===taskId;});
  if(!t)return;
  var emp=emps.find(function(e){return e.id===t.empId;})||{name:"?"};
  var saved=t.checklist||{};
  var done=Object.keys(saved).filter(function(k){return saved[k];}).length;
  var total=DEFAULT_CHECKS.length;
  var pct=Math.round((done/total)*100);
  var h='<div style="margin-bottom:12px"><div style="font-weight:700;font-size:14px;color:var(--g2)">'+t.title+'</div>';
  h+='<div style="font-size:11px;color:var(--t2)">'+emp.name+' - '+t.date+'</div></div>';
  h+='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--t2);margin-bottom:5px"><span>Progression</span><span>'+done+'/'+total+' ('+pct+'%)</span></div>';
  h+='<div style="background:var(--s3);border-radius:99px;height:6px"><div style="width:'+pct+'%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g3),var(--g2))"></div></div></div>';
  DEFAULT_CHECKS.forEach(function(item,i){
    var checked=saved[i]===true;
    var bc=checked?"var(--gn)":"var(--bd)";
    var tick=checked?'<svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:none;stroke:#000;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>':"";
    h+='<div onclick="toggleCheck('+taskId+','+i+')" style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--s2);border-radius:9px;margin-bottom:6px;cursor:pointer;border:1px solid '+bc+'">';
    h+='<div style="width:20px;height:20px;border-radius:6px;border:2px solid '+bc+';background:'+(checked?"var(--gn)":"transparent")+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+tick+'</div>';
    h+='<span style="font-size:12px;color:'+(checked?"var(--tx)":"var(--t2)")+'">'+item+'</span></div>';
  });
  document.getElementById("cl-content").innerHTML=h;
  document.getElementById("cl-task-id").value=taskId;
  document.getElementById("cl-modal").classList.add("op");
}
function toggleCheck(taskId,idx){
  var t=tasks.find(function(x){return x.id===taskId;});
  if(!t)return;
  if(!t.checklist)t.checklist={};
  t.checklist[idx]=!t.checklist[idx];
  tasks=tasks.map(function(x){return x.id===taskId?t:x;});
  persist();openChecklist(taskId);
}
function saveChecklist(){
  var taskId=parseInt(document.getElementById("cl-task-id").value);
  var t=tasks.find(function(x){return x.id===taskId;});
  if(!t)return;
  var saved=t.checklist||{};
  var done=Object.keys(saved).filter(function(k){return saved[k];}).length;
  if(done<DEFAULT_CHECKS.length){var ok=confirm(done+"/"+DEFAULT_CHECKS.length+" coches. Valider quand meme ?");if(!ok)return;}
  tasks=tasks.map(function(x){return x.id===taskId?Object.assign({},x,{checklistDone:true}):x;});
  persist();closeChecklist();addN("Checklist validee : "+t.title);render();
}
function closeChecklist(){document.getElementById("cl-modal").classList.remove("op");}
</script>
